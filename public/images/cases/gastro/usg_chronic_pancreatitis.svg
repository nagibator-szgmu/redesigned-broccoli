<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="background:#080c14;font-family:monospace;">
  <defs>
    <radialGradient id="pancBeam" cx="50%" cy="5%" r="85%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05080f" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Ultrasound Beam Sector -->
  <path d="M 300 20 L 70 340 A 320 320 0 0 0 530 340 Z" fill="url(#pancBeam)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Depth Grid -->
  <path d="M 230 110 A 100 100 0 0 1 370 110" fill="none" stroke="#283548" stroke-width="0.8" stroke-dasharray="3,3"/>
  <path d="M 170 180 A 180 180 0 0 1 430 180" fill="none" stroke="#283548" stroke-width="0.8" stroke-dasharray="3,3"/>
  <path d="M 120 260 A 260 260 0 0 1 480 260" fill="none" stroke="#283548" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Anatomical Landmarks -->
  <!-- Aorta (Anechoic circle) -->
  <circle cx="300" cy="225" r="14" fill="#04060a" stroke="#475569" stroke-width="1"/>
  <!-- Splenic Vein (Crescent anechoic vessel under pancreas) -->
  <path d="M 210 185 Q 295 198 390 178 Q 380 190 295 210 Q 215 198 210 185 Z" fill="#04060a" stroke="#334155" stroke-width="0.9"/>

  <!-- Pancreas Parenchyma (Irregular, lobulated, coarse, hyperechoic) -->
  <path d="M 195 160 C 215 140 280 148 340 142 C 400 138 425 155 420 175 C 390 188 340 180 270 188 C 210 190 185 180 195 160 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,2" opacity="0.9"/>

  <!-- Hyperechoic Fibrotic Foci & Microcalcifications -->
  <circle cx="235" cy="165" r="2.5" fill="#f8fafc"/>
  <circle cx="280" cy="155" r="3" fill="#f8fafc"/>
  <circle cx="360" cy="158" r="2.8" fill="#f8fafc"/>
  <circle cx="395" cy="168" r="2.2" fill="#f8fafc"/>

  <!-- Dilated Wirsung Duct (Anechoic tubular structure, 2.6 mm) -->
  <path d="M 220 168 Q 295 162 385 155" fill="none" stroke="#06090e" stroke-width="5" stroke-linecap="round"/>
  <path d="M 220 168 Q 295 162 385 155" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Caliper Marks on Duct -->
  <line x1="305" y1="160" x2="305" y2="167" stroke="#38bdf8" stroke-width="1"/>
  <text x="312" y="166" fill="#38bdf8" font-size="8">2.6 mm</text>

  <!-- Overlay UI Info -->
  <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="bold">MEDSIM ULTRASOUND HD</text>
  <text x="20" y="44" fill="#94a3b8" font-size="9.5">ORGAN: PANCREAS TRANS · PROBE: C5-2</text>
  <text x="20" y="58" fill="#94a3b8" font-size="9.5">ГОЛОВКА: 27 мм · ТЕЛО: 18 мм · ХВОСТ: 24 мм</text>

  <!-- Diagnostic Badge -->
  <rect x="20" y="295" width="225" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="313" fill="#f59e0b" font-size="10" font-weight="bold">ХРОНИЧЕСКИЙ ПАНКРЕАТИТ</text>
  <text x="28" y="326" fill="#e2e8f0" font-size="9">Паренхима диффузно неоднородна</text>
  <text x="28" y="337" fill="#e2e8f0" font-size="9">Вирсунгов проток расширен (2.6 мм)</text>
</svg>
