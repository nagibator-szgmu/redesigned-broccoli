<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="background:#05070d;font-family:sans-serif;">
  <defs>
    <!-- Inflamed Hyperemic Mucosa Gradient -->
    <radialGradient id="ucLight" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="ucLumen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="70%" stop-color="#1f0303"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="360" fill="#030508"/>
  <circle cx="300" cy="180" r="165" fill="#0e0404" stroke="#261010" stroke-width="4"/>

  <!-- Colonic Wall with Diffuse Inflammatory Hyperemia -->
  <circle cx="300" cy="180" r="162" fill="url(#ucLight)"/>

  <!-- Edematous, Blunted Haustral Folds (Loss of Sharp Architecture) -->
  <path d="M 145 160 Q 230 135 330 150 Q 400 160 455 190 Q 380 200 280 185 Q 180 185 145 160 Z" fill="#991b1b" opacity="0.8"/>
  <path d="M 155 220 Q 250 245 360 230 Q 425 210 455 180 Q 380 235 270 230 Q 185 225 155 220 Z" fill="#7f1d1d" opacity="0.85"/>

  <!-- Colonic Lumen in Distance -->
  <ellipse cx="320" cy="180" rx="44" ry="38" fill="url(#ucLumen)"/>

  <!-- Fine Granularity & Loss of Vascular Pattern (Mayo 1) -->
  <!-- Stippled Texture Pattern -->
  <g fill="#7f1d1d" opacity="0.45">
    <circle cx="210" cy="140" r="1.5"/><circle cx="225" cy="135" r="1.2"/><circle cx="240" cy="145" r="1.8"/>
    <circle cx="215" cy="155" r="1.4"/><circle cx="230" cy="165" r="1.5"/><circle cx="250" cy="160" r="1.2"/>
    <circle cx="360" cy="140" r="1.6"/><circle cx="375" cy="150" r="1.4"/><circle cx="390" cy="135" r="1.8"/>
    <circle cx="370" cy="165" r="1.5"/><circle cx="385" cy="180" r="1.7"/><circle cx="410" cy="170" r="1.3"/>
    <circle cx="240" cy="220" r="1.5"/><circle cx="260" cy="235" r="1.8"/><circle cx="275" cy="225" r="1.4"/>
    <circle cx="330" cy="230" r="1.6"/><circle cx="350" cy="245" r="1.5"/><circle cx="370" cy="235" r="1.7"/>
  </g>

  <!-- Pinpoint Mucosal Friability / Contact Bleeding (Кровавая роса) -->
  <g fill="#dc2626">
    <circle cx="235" cy="150" r="2.8"/>
    <circle cx="242" cy="153" r="2.2"/>
    <circle cx="280" cy="142" r="3.2"/>
    <circle cx="365" cy="155" r="3"/>
    <circle cx="372" cy="158" r="2.4"/>
    <circle cx="260" cy="215" r="2.8"/>
    <circle cx="340" cy="220" r="3.1"/>
    <circle cx="347" cy="224" r="2.1"/>
  </g>
  <g fill="#b91c1c">
    <ellipse cx="238" cy="154" rx="4" ry="2"/>
    <ellipse cx="282" cy="145" rx="5" ry="2.5"/>
    <ellipse cx="368" cy="159" rx="4.5" ry="2"/>
  </g>

  <!-- Glistening Highlights -->
  <ellipse cx="220" cy="130" rx="8" ry="3.5" fill="#ffffff" opacity="0.45" transform="rotate(-15 220 130)"/>
  <ellipse cx="380" cy="210" rx="9" ry="4" fill="#ffffff" opacity="0.4" transform="rotate(25 380 210)"/>

  <!-- Overlay UI Info -->
  <text x="20" y="30" fill="#38bdf8" font-size="11" font-weight="bold">OLYMPUS EVIS EXERA III</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9.5">LOC: RECTOSIGMOID · MAYO ENDO SCORE: 1</text>

  <!-- Diagnostic Badge -->
  <rect x="20" y="295" width="245" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="313" fill="#ef4444" font-size="10" font-weight="bold">ЯЗВЕННЫЙ КОЛИТ (MAYO 1)</text>
  <text x="28" y="326" fill="#e2e8f0" font-size="9">Смазанность сосудистого рисунка</text>
  <text x="28" y="337" fill="#e2e8f0" font-size="9">Зернистость, контактная ранимость</text>
</svg>
