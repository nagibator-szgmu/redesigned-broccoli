<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="background:#05070d;font-family:sans-serif;">
  <defs>
    <radialGradient id="stomachLight" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#dc2626" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#7f1d1d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="pylorusHole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="70%" stop-color="#2a0505"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="360" fill="#030508"/>
  <circle cx="300" cy="180" r="165" fill="#0e0404" stroke="#261010" stroke-width="4"/>

  <!-- Gastric Lumen & Mucosa -->
  <circle cx="300" cy="180" r="162" fill="url(#stomachLight)"/>

  <!-- Longitudinal Gastric Rugae (Folds) -->
  <path d="M 140 180 Q 220 140 330 160 Q 420 130 460 170 Q 380 185 280 175 Q 180 195 140 180 Z" fill="#991b1b" opacity="0.75"/>
  <path d="M 160 230 Q 250 250 350 220 Q 430 240 455 200 Q 380 245 270 240 Q 180 235 160 230 Z" fill="#7f1d1d" opacity="0.8"/>
  <path d="M 170 125 Q 260 100 370 115 Q 430 110 445 140 Q 360 130 250 125 Q 180 135 170 125 Z" fill="#b91c1c" opacity="0.65"/>

  <!-- Antral Lumen / Pyloric Opening in Distance -->
  <ellipse cx="370" cy="165" rx="36" ry="30" fill="url(#pylorusHole)"/>
  <circle cx="370" cy="165" r="16" fill="#05070a"/>

  <!-- Mild Patchy Erythema (Non-atrophic Superficial Gastritis) -->
  <ellipse cx="270" cy="195" rx="22" ry="14" fill="#ef4444" opacity="0.6"/>
  <ellipse cx="230" cy="155" rx="18" ry="10" fill="#ef4444" opacity="0.5"/>

  <!-- Glistening Highlights -->
  <ellipse cx="240" cy="130" rx="9" ry="4" fill="#ffffff" opacity="0.55" transform="rotate(-15 240 130)"/>
  <ellipse cx="320" cy="235" rx="11" ry="5" fill="#ffffff" opacity="0.45" transform="rotate(20 320 235)"/>

  <!-- Overlay UI Info -->
  <text x="20" y="30" fill="#38bdf8" font-size="11" font-weight="bold">OLYMPUS EVIS EXERA III</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9.5">LOC: CORPUS / ANTRUM · BIOPSY: HP-TEST (−)</text>

  <!-- Diagnostic Badge -->
  <rect x="20" y="300" width="230" height="46" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="318" fill="#22c55e" font-size="10" font-weight="bold">ФГДС: ОРГАНИЧЕСКИЙ ДЕФЕКТ ИСКЛЮЧЁН</text>
  <text x="28" y="331" fill="#e2e8f0" font-size="9">Умеренная эритематозная гастропатия.</text>
  <text x="28" y="341" fill="#e2e8f0" font-size="9">Язв, полипов, новообразований нет.</text>
</svg>
