<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="background:#05070d;font-family:sans-serif;">
  <defs>
    <!-- Endoscope Lens Aperture Radial Gradient -->
    <radialGradient id="endoLight" cx="45%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ffb4a2" stop-opacity="1"/>
      <stop offset="35%" stop-color="#e27367" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#b8453a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a1510" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="lumenDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1a0604" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4a1510" stop-opacity="0"/>
    </radialGradient>
    <!-- Highlight reflections -->
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Circular Endoscope Aperture Mask -->
  <rect x="0" y="0" width="600" height="360" fill="#030508"/>
  <circle cx="300" cy="180" r="165" fill="#0e0404" stroke="#261010" stroke-width="4"/>

  <!-- Colonic Wall with Endoscopic Illumination -->
  <circle cx="300" cy="180" r="162" fill="url(#endoLight)"/>

  <!-- Colonic Haustral Folds (Crescent Semilunar Folds) -->
  <path d="M 145 150 Q 230 110 330 130 Q 390 145 450 200 Q 370 170 270 160 Q 180 165 145 150 Z" fill="#c45044" opacity="0.8"/>
  <path d="M 160 230 Q 250 260 360 240 Q 420 220 460 170 Q 390 230 280 235 Q 190 225 160 230 Z" fill="#9e3026" opacity="0.85"/>

  <!-- Central Intestinal Lumen (Deep Tunnel) -->
  <ellipse cx="310" cy="185" rx="48" ry="42" fill="url(#lumenDark)"/>

  <!-- Fine Branching Mucosal Capillary Network (Normal Vascular Pattern) -->
  <g stroke="#9e1f18" stroke-width="0.9" fill="none" opacity="0.65">
    <path d="M 210 110 Q 225 125 240 120 T 260 135"/>
    <path d="M 235 123 Q 245 130 250 145"/>
    <path d="M 370 120 Q 355 135 345 150 T 330 160"/>
    <path d="M 360 130 Q 375 140 380 155"/>
    <path d="M 180 190 Q 200 195 215 185 T 235 190"/>
    <path d="M 205 194 Q 210 205 218 215"/>
    <path d="M 380 230 Q 360 220 345 225 T 330 215"/>
    <path d="M 365 223 Q 360 210 350 205"/>
  </g>

  <!-- Wet Mucosal Specular Highlights (Glistening Reflections) -->
  <ellipse cx="230" cy="140" rx="8" ry="4" fill="url(#gloss)" transform="rotate(-20 230 140)"/>
  <ellipse cx="380" cy="165" rx="10" ry="5" fill="url(#gloss)" transform="rotate(35 380 165)"/>
  <ellipse cx="270" cy="245" rx="12" ry="4" fill="url(#gloss)" transform="rotate(10 270 245)"/>

  <!-- Overlay UI Info (Olympus Endoscopy Style) -->
  <text x="20" y="30" fill="#38bdf8" font-size="11" font-weight="bold">OLYMPUS EVIS EXERA III</text>
  <text x="20" y="46" fill="#94a3b8" font-size="9.5">COLONOSCOPY HD · NBI: OFF</text>
  <text x="500" y="30" fill="#64748b" font-size="9.5">1080p 60fps</text>

  <!-- Diagnostic Badge -->
  <rect x="20" y="305" width="220" height="40" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="30" y="322" fill="#22c55e" font-size="10" font-weight="bold">ТОЛСТАЯ КИШКА: НОРМА</text>
  <text x="30" y="335" fill="#cbd5e1" font-size="9">Сосудистый рисунок сохранен. Эрозий нет.</text>
</svg>
