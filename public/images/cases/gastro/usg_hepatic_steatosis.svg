<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" style="background:#080c14;font-family:monospace;">
  <defs>
    <!-- Steatosis Beam: Very bright near field, sharp posterior attenuation -->
    <radialGradient id="steatosisBeam" cx="50%" cy="5%" r="85%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#141c2c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05080f" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Ultrasound Beam Sector -->
  <path d="M 300 20 L 70 340 A 320 320 0 0 0 530 340 Z" fill="url(#steatosisBeam)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Depth Grid -->
  <path d="M 230 110 A 100 100 0 0 1 370 110" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3"/>
  <path d="M 170 180 A 180 180 0 0 1 430 180" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="3,3"/>
  <path d="M 120 260 A 260 260 0 0 1 480 260" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Bright Hyperechoic Liver Parenchyma (Near Field) -->
  <ellipse cx="300" cy="140" rx="140" ry="70" fill="#64748b" opacity="0.35"/>
  <ellipse cx="280" cy="120" rx="90" ry="40" fill="#94a3b8" opacity="0.25"/>

  <!-- Attenuation Boundary (Deep field darkens significantly) -->
  <path d="M 170 200 Q 300 185 430 200 L 460 280 Q 300 290 140 280 Z" fill="#090d16" opacity="0.75"/>

  <!-- Right Kidney for Echo-Comparison (Morison's Pouch) -->
  <!-- Kidney Capsule -->
  <ellipse cx="330" cy="235" rx="50" ry="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.2" opacity="0.85" transform="rotate(15 330 235)"/>
  <!-- Renal Cortex (Normally hypoechoic compared to liver, here contrast is massive) -->
  <ellipse cx="330" cy="235" rx="42" ry="24" fill="#05080f" opacity="0.9" transform="rotate(15 330 235)"/>
  <!-- Central Renal Sinus (Echo-dense) -->
  <ellipse cx="330" cy="235" rx="20" ry="10" fill="#cbd5e1" opacity="0.7" transform="rotate(15 330 235)"/>

  <!-- Label Arrows / Callouts -->
  <text x="220" y="95" fill="#f8fafc" font-size="9" font-weight="bold">ПЕЧЕНЬ: ГИПЕРЭХОГЕННА («БЕЛАЯ»)</text>
  <line x1="260" y1="100" x2="280" y2="115" stroke="#f8fafc" stroke-width="1"/>

  <text x="350" y="275" fill="#38bdf8" font-size="9">ПОЧКА (КОРТЕКС)</text>
  <line x1="350" y1="265" x2="340" y2="245" stroke="#38bdf8" stroke-width="1"/>

  <!-- Scale on the Right -->
  <g fill="#64748b" font-size="9">
    <line x1="560" y1="80" x2="570" y2="80" stroke="#64748b" stroke-width="1"/>
    <text x="575" y="83">4cm</text>
    <line x1="560" y1="160" x2="570" y2="160" stroke="#64748b" stroke-width="1"/>
    <text x="575" y="163">8cm</text>
    <line x1="560" y1="240" x2="570" y2="240" stroke="#64748b" stroke-width="1"/>
    <text x="575" y="243">12cm</text>
  </g>

  <!-- Overlay UI Info -->
  <text x="20" y="28" fill="#38bdf8" font-size="12" font-weight="bold">MEDSIM ULTRASOUND HD</text>
  <text x="20" y="44" fill="#94a3b8" font-size="9.5">ORGAN: HEPAR · PROBE: C5-2</text>
  <text x="20" y="58" fill="#94a3b8" font-size="9.5">КВР: 162 мм (увеличена) · ККР: 108 мм</text>

  <!-- Diagnostic Badge -->
  <rect x="20" y="295" width="220" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="28" y="313" fill="#eab308" font-size="10" font-weight="bold">ДИФФУЗНЫЙ СТЕАТОЗ ПЕЧЕНИ</text>
  <text x="28" y="326" fill="#e2e8f0" font-size="9">Выраженное дистальное затухание</text>
  <text x="28" y="337" fill="#e2e8f0" font-size="9">Обеднение сосудистого рисунка</text>
</svg>
