<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
<style>
  .bg { fill: #070d17; }
  .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 23px; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 12.5px; }
  .status-badge { fill: #064e3b; stroke: #059669; stroke-width: 1; rx: 6; }
  .status-text { fill: #34d399; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 11px; font-weight: 600; }
  .row-title { fill: #38bdf8; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 14px; font-weight: 700; }
  .row-desc { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 10.5px; }
  .col-header { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; letter-spacing: 0.5px; }
  .card-old { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 10; }
  .card-va { fill: #0f172a; stroke: #0284c7; stroke-width: 1.6; rx: 10; }
  .card-vb { fill: #0f172a; stroke: #059669; stroke-width: 1.6; rx: 10; }
  .badge-rec { fill: #0284c7; rx: 4; }
  .badge-rec-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 9px; font-weight: 700; text-anchor: middle; }
  .icon-label { fill: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
  .icon-sub { fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; text-anchor: middle; }
  .stroke-old { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stroke-va { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .stroke-vb { fill: none; stroke: #34d399; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
</style>

<rect width="1000" height="1000" class="bg" />

<!-- Header -->
<text x="35" y="44" class="title">Новые варианты 4 иконок MedSim</text>
<text x="35" y="68" class="subtitle">Токсикология (Вариант 2) и Гастро (Вариант 1) утверждены. Выберите варианты для 4 позиций:</text>

<!-- Confirmed badges -->
<g transform="translate(35, 86)">
  <rect width="220" height="24" class="status-badge" />
  <text x="10" y="16" class="status-text">✓ Токса: Флакон токсина</text>
</g>
<g transform="translate(265, 86)">
  <rect width="240" height="24" class="status-badge" />
  <text x="10" y="16" class="status-text">✓ Гастро: J-желудок + 12-перстная</text>
</g>

<!-- Column Headers -->
<text x="435" y="145" class="col-header">ТЕКУЩАЯ (Было)</text>
<text x="645" y="145" class="col-header">ВАРИАНТ А (ХИТ)</text>
<text x="855" y="145" class="col-header">ВАРИАНТ B (Альтернатива)</text>

